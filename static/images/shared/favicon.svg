    <path d="M16 11.1V8.4"/>
    <path d="M16 8.4c-2.2-1.5-4.3-1.7-6.1-.6 1.3 1.9 3.2 2.7 5.6 2.4"/>
    <path d="M16 8.4c2.2-1.5 4.3-1.7 6.1-.6-1.3 1.9-3.2 2.7-5.6 2.4"/>
